# Tap Revolution default settings.
#
# This file is the version-controlled baseline. At runtime the game writes a
# separate persistent file (see tap_revolution.persistent_file in the master
# config); "Reset Settings" in the game menu copies these defaults back over it.
# Any key omitted here falls back to the code default.

# Which key triggers each lane. Values are arrow names (left/right/up/down) or a
# single character (e.g. a/d/w/s for a letter layout).
keys:
  left:  left
  right: right
  up:    up
  down:  down

# Score buckets, easiest-to-hardest by time threshold (seconds of timing error).
# A tap within the widest threshold scores; wider is a miss.
score_buckets:
  - {name: BEST, threshold: 0.045, points: 10}
  - {name: GOOD, threshold: 0.090, points: 5}
  - {name: OK,   threshold: 0.140, points: 1}

# Tapping a lane with nothing in the hit box is a BAD tap.
bad_tap:
  enabled: true    # false -> ghost taps are a no-op and BAD is hidden from results
  cooldown: 0.15   # seconds the lane ignores further BAD taps (0 disables)
  penalty: 5       # points subtracted per BAD tap (score never goes below 0)

# Difficulty levels (arbitrary list; name must be a single word with no spaces).
#   gap          — minimum milliseconds between notes; 0 shows the full chart.
#   scroll_time  — seconds an arrow takes to cross the track; null keeps the
#                  chart's own value. Keep this <= ~3.0 (≈0.27s/tube on 16 tubes):
#                  slower than that and the arrows step too coarsely to read as
#                  motion (a frozen "slideshow") and timing feels off.
#   window_scale — multiplies every score_buckets threshold, so a larger value
#                  is more forgiving timing.
difficulties:
  - name: hard
    display_name: Hard
    gap: 0
    scroll_time: null
    window_scale: 1.0
  - name: medium
    display_name: Medium
    gap: 200
    scroll_time: 2.5
    window_scale: 1.4
  - name: easy
    display_name: Easy
    gap: 400
    scroll_time: 3.0
    window_scale: 1.8

# Active difficulty — references the name field of an entry in difficulties above.
difficulty: hard

grace: 0.12        # seconds past the widest window before a note auto-misses
flash_secs: 0.6    # how long the score section flashes a judgement word
score_width: 4     # right-hand tubes reserved for the live score
judge_flash: true  # flash the judgement word in the score section
results_secs: 6    # freeze time for the end-of-game results (if it fits)

# The quick burst shown on the target tube when a note is hit.
hit_flash:
  frames: [x, +, x]
  frame_secs: 0.05

# Audio settings.
# audio_dir: directory to search for audio files referenced by bare filename in .trl
#   headers. If the audio field contains a '/' it is treated as a path instead.
# audio_offset_ms: how many ms audio arrives late (positive for Bluetooth).
#   Start audio this many ms early to compensate. Set via Calibrate in the menu.
# calibration_track: path to a .trl file used for audio calibration. If blank, a
#   generated click track is used.
audio_dir: ""
audio_offset_ms: 0
calibration_track: ""
