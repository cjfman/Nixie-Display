# Example master config for run_display, loaded with: ./run_display -c terminal --config config/nixie.example.yaml
#
# Every key here is optional. Precedence is: command-line argument > this file >
# built-in default. Anything omitted falls back to the built-in default, so a
# minimal config is fine.

# --- equivalents of command-line arguments (CLI overrides these) ---
# serial: /dev/ttyACM0          # implies the serial controller
# keyboard_event_file: /dev/input/event0
animations_dir: animations
levels_dir: levels
extended_hours: false           # pre/after-market stock data
# git_check: 15                 # minutes between update checks (omit to disable)
git_origin: "@{u}"
# logfile: ~/logs/nixie.log
# log_tail: 200                 # lines tailed by the Logs menu viewer
loglevel: info

# --- thread polling cadences (seconds). Values are clamped to safe bounds. ---
polling:
  assembler_poll_interval: 0.001   # frame push rate ceiling   [0.0005 .. 0.05]
  scheduler_period: 0.1            # idle program poll         [0.01 .. 5.0]
  scheduler_active_period: 0.02    # poll while the menu is open (<= scheduler_period)

# --- optional controller tuning ---
# controller:
#   raspi_speed: 1000000          # SPI clock for the raspi controller

# --- Tap Revolution: paths to its own config files ---
tap_revolution:
  defaults_file: config/tap_revolution.defaults.yaml
  persistent_file: config/tap_revolution.yaml   # written at runtime; gitignored

# --- Audio menu settings ---
# audio:
#   test_sound: audio-test-signal   # filename stem (without .oga) under
#                                   # /usr/share/sounds/freedesktop/stereo/
#                                   # Falls back to a generated 1 kHz beep if absent.

# --- WiFi access point (on-demand fallback, toggled from the menu) ---
# The Pi can broadcast its own WPA2 network so you can SSH in (ssh nixie@192.168.4.1)
# when no external WiFi/USB is available. Off by default and after every reboot.
# wifi_ap:
#   ssid: nixie-control             # 1-32 chars (invalid -> default)
#   password: neon-tube-backdoor-64 # WPA2: 8-63 chars (invalid -> default)

# --- Nixie Shell: a limited, mostly read-only command line menu item ---
# Every key is optional; omitting the whole section uses the defaults below.
# nixie_shell:
#   # Commands permitted to run. A bare name allows any arguments; multi-word
#   # entries must match as a prefix, and a trailing '*' allows the remainder.
#   allow_list:
#     - ls
#     - cat
#     - echo
#     - wc
#     - host
#     - dig
#     - du
#     - pactl info
#     - pactl list *
#     - systemctl status *
#     - systemctl --user status *
#   # NOTE: 'find' is a built-in special command (not configured here). It takes
#   # exactly one operand: a directory (which it lists) or a file (whose name it
#   # echoes). Options and extra operands are rejected.
#   # Extra always-blocked command names (fnmatch patterns, e.g. "python*").
#   # These ADD to a built-in block list (sudo, rm, bash, env, ... ) that always
#   # applies. Likewise, secret paths (~/.ssh, ~/.aws, *.pem, /etc/shadow, ... )
#   # are ALWAYS denied as command arguments and cannot be re-enabled here.
#   block_list: []
#   # Extra .gitignore-style paths to deny as command arguments (added to the
#   # always-on secret-path deny list).
#   path_deny_list: []
#   max_output_bytes: 65536         # cap on captured output (truncated past this)
#   max_output_lines: 2000
#   timeout: 30                     # seconds before a running command is SIGINT'd
#                                   # (default 30; set null to disable. ESC ->
#                                   # Cancel always works regardless.)
#   history_file: ~/logs/nixie_shell_history   # persist command history across
#                                   # runs (the 'history' command shows it; up
#                                   # arrow recalls). Omit to keep history only
#                                   # in memory for the running process. May
#                                   # contain commands as typed.
